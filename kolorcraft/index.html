<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard Vincent</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;

    background: url('background.jpg') no-repeat center center fixed;
    background-size: cover;

    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/* CARD — bring back tinted glass look */
.card {
    width: 90%;
    max-width: 320px;

    background: rgba(80, 40, 60, 0.55); /* soft maroon tint */
    border-radius: 18px;
    padding: 22px;
    text-align: center;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    color: white;
}

/* Logo */
.logo {
    width: 80px;
    margin-bottom: 10px;
}

/* Text */
.name {
    font-size: 20px;
    font-weight: 700;
}

.role {
    font-size: 14px;
    color: #e5e7eb;
    margin-bottom: 18px;
}

/* BUTTONS — back to soft pill style */
.button {
    display: block;
    margin: 10px 0;
    padding: 12px;
    border-radius: 999px;
    text-decoration: none;
    color: white;
    font-weight: 500;

    background: rgba(20,20,20,0.6);
    border: 1px solid rgba(255,255,255,0.05);

    box-shadow: 0 0 12px rgba(236,72,153,0.25);

    transition: all 0.2s ease;
}

.button:hover {
    transform: scale(1.03);
    background: rgba(30,30,30,0.8);
}

/* Company */
.company {
    margin-top: 14px;
    font-weight: 600;
}

/* Address */
.address {
    margin-top: 6px;
    font-size: 12px;
    color: #e5e7eb;
    line-height: 1.4;
}
</style>
</head>

<body>

<div class="card">

    <!-- LOGO -->
    <img src="logo.svg" class="logo">

    <div class="name">Richard Vincent</div>
    <div class="role">Database Developer</div>

    <!-- Phone -->
    <a href="tel:01924780512" class="button">
        ☎ 01924 780 512
    </a>

    <!-- Mobile -->
    <a href="tel:07968331469" class="button">
        📱 07968 331 469
    </a>

    <!-- Email -->
    <a href="mailto:rvincent@kolorcraft.com" class="button">
        ✉ rvincent@kolorcraft.com
    </a>

    <!-- Company -->
    <div class="company">Kolorcraft</div>

    <!-- Address -->
    <div class="address">
        Concept House<br>
        Milner Way<br>
        Ossett<br>
        WF5 9JE
    </div>

</div>

</body>
</html>
