<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard Vincent</title>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;

    background: url('background.jpg') no-repeat center center fixed;
    background-size: cover;

    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/* subtle overlay to improve contrast */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.2);
}

/* Glass card (neutral now, no colour tint) */
.card {
    position: relative;
    width: 90%;
    max-width: 380px;

    background: rgba(24, 24, 28, 0.55);
    border-radius: 20px;
    padding: 25px;
    text-align: center;

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    color: white;
}

/* Logo */
.logo {
    width: 110px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.15));
}

/* Text */
.name {
    font-size: 22px;
    font-weight: 700;
}

.role {
    color: #d1d5db;
    margin-bottom: 20px;
}

/* Buttons (cleaner, sharper) */
.button {
    display: block;
    margin: 12px 0;
    padding: 14px;
    border-radius: 50px;
    text-decoration: none;
    color: white;
    font-weight: 600;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);

    border: 1px solid rgba(255,255,255,0.2);

    transition: 0.25s ease;
}

/* Accent borders instead of messy glow */
.phone {
    border-left: 4px solid #f43f5e; /* pink */
}

.mobile {
    border-left: 4px solid #3b82f6; /* blue */
}

.email {
    border-left: 4px solid #a855f7; /* purple */
}

.button:hover {
    transform: translateY(-2px) scale(1.02);
    background: rgba(255,255,255,0.12);
}

/* Company */
.company {
    margin-top: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

/* Address */
.address {
    margin-top: 6px;
    font-size: 13px;
    color: #d1d5db;
    line-height: 1.4;
}
</style>
</head>

<body>

<div class="card">

    <!-- LOGO -->
    <img src="logo.svg" class="logo">

    <div class="name">Richard Vincent</div>
    <div class="role">Database Developer</div>

    <!-- Phone -->
    <a class="button phone" href="tel:01924780512">
        ☎ 01924 780 512
    </a>

    <!-- Mobile -->
    <a class="button mobile" href="tel:07968331469">
        📱 07968 331 469
    </a>

    <!-- Email -->
    <a class="button email" href="mailto:rvincent@kolorcraft.com">
        ✉ rvincent@kolorcraft.com
    </a>

    <!-- Company -->
    <div class="company">Kolorcraft</div>

    <!-- Address -->
    <div class="address">
        Concept House<br>
        Milner Way<br>
        Ossett<br>
        WF5 9JE
    </div>

</div>

</body>
</html>
